name: Update EV Charging Data

on:
  schedule:
    # 每天早晚 8 點自動更新 (UTC 00:00, 12:00)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊按鈕立即執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Station & News Updater
        run: |
          python scripts/update_stations.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/stations.json data/news.json
          git commit -m "Auto update EV charging stations and news [skip ci]" || echo "No changes to commit"
          git push
