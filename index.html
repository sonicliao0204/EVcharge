<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 台灣充電情報戰情室 V7.0</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <style>
        :root { 
            --bg-color: #f8fafc; --text-main: #0f172a; --text-muted: #64748b; --card-bg: #ffffff; 
            --primary-color: #ef4444; --border-color: #e2e8f0; --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.05);
            --radius-md: 12px; --radius-lg: 16px;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a; --text-main: #f8fafc; --text-muted: #94a3b8; --card-bg: #1e293b; --border-color: #334155; 
        }
        [data-theme="dark"] .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 1200px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border-color); flex-wrap: wrap; gap: 10px; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        
        .main-nav { display: flex; background: var(--card-bg); border: 1px solid var(--border-color); padding: 6px; border-radius: 14px; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-btn { padding: 9px 15px; font-size: 13px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; background: transparent; color: var(--text-muted); transition: 0.2s; }
        .nav-btn:hover { color: var(--text-main); }
        .nav-btn.active { background: var(--bg-color); color: var(--primary-color); border: 1px solid var(--border-color); }

        .section { display: none; background: var(--card-bg); padding: 22px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
        .section.active { display: block; }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .kpi-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; border-left: 4px solid var(--primary-color); }
        .kpi-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .kpi-value { font-size: 24px; font-weight: 800; color: var(--text-main); }

        .btn-action { background: #8b5cf6; color: white; border: none; cursor: pointer; padding: 9px 18px; border-radius: 8px; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .btn-action:hover { opacity: 0.9; }

        .data-table { width: 100%; min-width: 800px; border-collapse: collapse; text-align: center; }
        .data-table th, .data-table td { padding: 11px; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .data-table th { background: var(--bg-color); font-weight: 700; color: var(--text-muted); }

        .news-card { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-color); margin-bottom: 10px; }
        .news-cpo { width: 90px; text-align: center; padding: 5px 0; border-radius: 6px; font-weight: 700; font-size: 12px; background: var(--card-bg); border: 1px solid var(--border-color); }
        .news-link { color: var(--text-main); font-weight: bold; text-decoration: none; font-size: 14px; }
        .news-link:hover { color: var(--primary-color); text-decoration: underline; }

        .log-textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: monospace; background: var(--bg-color); color: var(--text-main); box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <h1>⚡ 台灣充電情報戰情室 <span style="font-size: 12px; background: #8b5cf6; color: white; padding: 3px 8px; border-radius: 12px;">V7.0 線上整合版</span></h1>
            <button class="nav-btn" onclick="toggleTheme()" style="border: 1px solid var(--border-color);">🌓 切換深淺色</button>
        </header>
        
        <nav class="main-nav">
            <button class="nav-btn active" onclick="switchTab('map')">🗺️ 站點地圖</button>
            <button class="nav-btn" onclick="switchTab('trend')">📈 數量動態排行</button>
            <button class="nav-btn" onclick="switchTab('compare')">🔥 競品定價分析</button>
            <button class="nav-btn" onclick="switchTab('rates')">💰 詳細費率矩陣</button>
            <button class="nav-btn" onclick="switchTab('news')">📡 市場即時情報</button>
            <button class="nav-btn" onclick="switchTab('kb')">🛠️ AI 診斷</button>
        </nav>

        <main>
            <!-- 1. 站點地圖 -->
            <section id="section-map" class="section active">
                <div class="kpi-grid">
                    <div class="kpi-card" style="border-left-color: #8b5cf6;"><div class="kpi-title">全台已收錄</div><div class="kpi-value" id="kpi-total">-- 站</div></div>
                    <div class="kpi-card" style="border-left-color: #10b981;"><div class="kpi-title">EVOASIS</div><div class="kpi-value" id="kpi-evo">-- 站</div></div>
                    <div class="kpi-card" style="border-left-color: #0369a1;"><div class="kpi-title">U-POWER</div><div class="kpi-value" id="kpi-upower">-- 站</div></div>
                    <div class="kpi-card" style="border-left-color: #ef4444;"><div class="kpi-title">Tesla (特斯拉)</div><div class="kpi-value" id="kpi-tesla">-- 站</div></div>
                    <div class="kpi-card" style="border-left-color: #f59e0b;"><div class="kpi-title">星舟快充</div><div class="kpi-value" id="kpi-titan">-- 站</div></div>
                </div>
                <div id="station-map" style="height: 540px; width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border-color);"></div>
            </section>

            <!-- 2. 數量排行 (AC/DC) -->
            <section id="section-trend" class="section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
                    <h3 style="margin:0;">全台營運商市場份額即時排行</h3>
                    <div style="display:flex; gap:6px;">
                        <button class="nav-btn active" id="btn-dc" onclick="renderChart('DC')" style="border:1px solid var(--border-color);">⚡ DC 快充 (≥30kW)</button>
                        <button class="nav-btn" id="btn-ac" onclick="renderChart('AC')" style="border:1px solid var(--border-color);">🔌 AC 慢充 (&lt;30kW)</button>
                    </div>
                </div>
                <div style="height: 420px;"><canvas id="expansionChart"></canvas></div>
            </section>

            <!-- 3. 競品定價分析 -->
            <section id="section-compare" class="section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h3 style="margin:0;">各大 CPO 尖離峰費率競價模型 (依市場基準校正)</h3>
                    <div style="display:flex; gap:6px;">
                        <button class="nav-btn active" id="btn-weekday" onclick="renderCompare(false)" style="border:1px solid var(--border-color);">工作日</button>
                        <button class="nav-btn" id="btn-weekend" onclick="renderCompare(true)" style="border:1px solid var(--border-color);">週末假日</button>
                    </div>
                </div>
                <div style="overflow-x:auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>時段</th><th>遠傳</th><th>EVOASIS</th><th>U-POWER</th><th>EVALUE</th><th>TAIL</th><th>定價優劣</th><th style="color:#ca8a04;">🤖 AI 建議策略</th>
                            </tr>
                        </thead>
                        <tbody id="compare-tbody"></tbody>
                    </table>
                </div>
            </section>

            <!-- 4. 詳細費率矩陣 -->
            <section id="section-rates" class="section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
                    <h3 style="margin:0;">分時電價週矩陣 (度/元)</h3>
                    <div id="rate-tabs" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
                </div>
                <div style="overflow-x:auto;">
                    <table class="data-table">
                        <thead>
                            <tr><th>時段</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th><th>週六</th><th>週日</th></tr>
                        </thead>
                        <tbody id="rate-tbody"></tbody>
                    </table>
                </div>
            </section>

            <!-- 5. 市場即時情報 -->
            <section id="section-news" class="section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
                    <h3 style="margin:0;">市場新聞情報牆 (全網聯網即時來源)</h3>
                    <button class="btn-action" style="background:#ea580c;" onclick="loadNews()">🔄 重新載入情報</button>
                </div>
                <div id="news-container">
                    <div style="color:var(--text-muted); text-align:center; padding:25px;">讀取中...</div>
                </div>
            </section>

            <!-- 6. AI 診斷 (靜態前台離線規則引擎) -->
            <section id="section-kb" class="section">
                <h3 style="margin-top:0;">🤖 OCPP Log 智慧診斷引擎</h3>
                <p style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">貼入 WebSocket 訊息片段即時解析錯誤原因與工程對策：</p>
                <textarea id="log-input" class="log-textarea" placeholder="貼上 Log 內容，例如：[3, '19223201', {'status':'Rejected'}]"></textarea>
                <button class="btn-action" style="background:var(--primary-color); margin-top:10px;" onclick="runDiagClient()">🔍 執行故障診斷</button>
                <div id="log-output" style="display:none; margin-top:15px; padding:15px; border-radius:8px; border-left:4px solid var(--primary-color); background:var(--bg-color);"></div>
            </section>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let mapInstance = null, markersLayer = null, chartInstance = null;
        let currentStations = [];
        let currentMode = 'DC';
        let currentRateCpo = '遠傳';

        // 預設費率結構 (若 pricing.json 載入失敗時備援)
        let pricingConfig = {
            '遠傳': { peak: 8.9, off: 6.8, hol: 7.5, ps: 16, pe: 21 },
            'EVOASIS': { peak: 9.2, off: 6.8, hol: 7.2, ps: 16, pe: 21 },
            'U-POWER': { flat: 9.0 },
            'EVALUE': { peak: 9.8, off: 7.5, hol: 8.0, ps: 16, pe: 21 },
            'TAIL': { peak: 9.9, off: 7.9, hol: 8.2, ps: 16, pe: 21 }
        };

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            renderChart(currentMode);
        }

        function switchTab(id) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('section-' + id).classList.add('active');
            if (id === 'map' && mapInstance) setTimeout(() => mapInstance.invalidateSize(), 100);
            if (id === 'trend') renderChart(currentMode);
        }

        async function initData() {
            mapInstance = L.map('station-map').setView([23.8, 120.9], 7);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
            markersLayer = new L.FeatureGroup().addTo(mapInstance);

            const cacheBuster = '?t=' + Date.now();
            try {
                // 載入站點資料
                const res = await fetch('./data/stations.json' + cacheBuster);
                currentStations = await res.json();
                updateUI();
            } catch (e) {
                console.error("載入 stations.json 失敗", e);
            }

            try {
                // 載入費率資料
                const pRes = await fetch('./data/pricing.json' + cacheBuster);
                const pData = await pRes.json();
                if (pData.providers) {
                    pricingConfig = {
                        '遠傳': { peak: pData.providers['遠傳'].peak, off: pData.providers['遠傳'].off_peak, hol: pData.providers['遠傳'].holiday, ps: 16, pe: 21 },
                        'EVOASIS': { peak: pData.providers['EVOASIS'].peak, off: pData.providers['EVOASIS'].off_peak, hol: pData.providers['EVOASIS'].holiday, ps: 16, pe: 21 },
                        'U-POWER': { flat: pData.providers['U-POWER'].flat },
                        'EVALUE': { peak: pData.providers['EVALUE'].peak, off: pData.providers['EVALUE'].off_peak, hol: pData.providers['EVALUE'].holiday, ps: 16, pe: 21 },
                        'TAIL': { peak: pData.providers['TAIL'].peak, off: pData.providers['TAIL'].off_peak, hol: pData.providers['TAIL'].holiday, ps: 16, pe: 21 }
                    };
                }
            } catch (e) {}

            renderCompare(false);
            initRateTabs();
            loadNews();
        }

        function updateUI() {
            markersLayer.clearLayers();
            let counts = {};

            currentStations.forEach(st => {
                let color = '#64748b';
                if (st.cpo === 'Tesla') color = '#ef4444';
                else if (st.cpo === 'EVOASIS') color = '#10b981';
                else if (st.cpo === 'U-POWER') color = '#0369a1';
                else if (st.cpo === 'EVALUE') color = '#16a34a';
                else if (st.cpo === '星舟快充') color = '#f59e0b';

                L.circleMarker([st.lat, st.lng], { radius: 5, fillColor: color, color: '#fff', weight: 1, fillOpacity: 0.85 })
                    .bindPopup(`<b>${st.name}</b><br>品牌: <b>${st.cpo}</b><br>最高功率: ${st.total_kw} kW<br>槍數: ${st.total_plugs}<br>狀態: ${st.status}`)
                    .addTo(markersLayer);

                counts[st.cpo] = (counts[st.cpo] || 0) + 1;
            });

            document.getElementById('kpi-total').innerText = currentStations.length + " 站";
            document.getElementById('kpi-evo').innerText = (counts['EVOASIS'] || 0) + " 站";
            document.getElementById('kpi-upower').innerText = (counts['U-POWER'] || 0) + " 站";
            document.getElementById('kpi-tesla').innerText = (counts['Tesla'] || 0) + " 站";
            document.getElementById('kpi-titan').innerText = (counts['星舟快充'] || 0) + " 站";

            renderChart(currentMode);
        }

        function renderChart(type) {
            currentMode = type;
            document.getElementById('btn-dc').className = 'nav-btn ' + (type === 'DC' ? 'active' : '');
            document.getElementById('btn-ac').className = 'nav-btn ' + (type === 'AC' ? 'active' : '');

            let counts = {};
            currentStations.forEach(st => {
                let isDC = st.total_kw >= 30;
                if (type === 'DC' && !isDC) return;
                if (type === 'AC' && isDC) return;
                counts[st.cpo] = (counts[st.cpo] || 0) + 1;
            });

            let sortedEntries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
            let labels = sortedEntries.map(e => e[0]);
            let dataVals = sortedEntries.map(e => e[1]);

            const palette = {
                'Tesla': '#ef4444', 'EVOASIS': '#10b981', 'U-POWER': '#0369a1', 'EVALUE': '#16a34a',
                'TAIL': '#0891b2', 'Noodoe': '#8b5cf6', '星舟快充': '#f59e0b', '台灣中油': '#b91c1c',
                'iCharging': '#ea580c', 'YES': '#ca8a04', 'FET': '#dc2626', '公有及自設': '#475569',
                '飯店民宿自備': '#0d9488', '車廠原廠': '#4f46e5', '其他': '#94a3b8'
            };
            let colors = labels.map(l => palette[l] || '#94a3b8');

            const ctx = document.getElementById('expansionChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            Chart.defaults.color = isDark ? '#94a3b8' : '#64748b';

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: type === 'DC' ? '全台 DC 快充站市佔 (≥30kW)' : '全台 AC 慢充站市佔 (<30kW)',
                        data: dataVals,
                        backgroundColor: colors,
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function getPrice(cpo, hour, isWeekend) {
            const conf = pricingConfig[cpo];
            if (!conf) return 0;
            if (conf.flat) return conf.flat;
            if (isWeekend) return conf.hol;
            return (hour >= conf.ps && hour <= conf.pe) ? conf.peak : conf.off;
        }

        function renderCompare(isWeekend) {
            document.getElementById('btn-weekday').className = 'nav-btn ' + (!isWeekend ? 'active' : '');
            document.getElementById('btn-weekend').className = 'nav-btn ' + (isWeekend ? 'active' : '');
            let html = '';
            for (let h = 0; h < 24; h++) {
                let p_fet = getPrice('遠傳', h, isWeekend);
                let p_evo = getPrice('EVOASIS', h, isWeekend);
                let p_up = getPrice('U-POWER', h, isWeekend);
                let p_eval = getPrice('EVALUE', h, isWeekend);
                let p_tail = getPrice('TAIL', h, isWeekend);

                let minOther = Math.min(p_evo, p_up, p_eval, p_tail);
                let tag = p_fet < minOther ? '<span style="color:#16a34a;">🏆 領先</span>' : (p_fet === minOther ? '<span>🤝 持平</span>' : '<span style="color:#dc2626;">⚠️ 偏高</span>');
                let rec = (minOther - 0.1).toFixed(1);

                html += `<tr>
                    <td style="font-weight:bold;">${String(h).padStart(2,'0')}:00</td>
                    <td style="font-weight:bold; color:var(--primary-color);">$${p_fet.toFixed(1)}</td>
                    <td style="color:#10b981; font-weight:bold;">$${p_evo.toFixed(1)}</td>
                    <td style="color:#0369a1; font-weight:bold;">$${p_up.toFixed(1)}</td>
                    <td>$${p_eval.toFixed(1)}</td>
                    <td>$${p_tail.toFixed(1)}</td>
                    <td>${tag}</td>
                    <td style="background:rgba(202,138,4,0.08); color:#ca8a04; font-weight:bold;">$${rec} (攻佔份額)</td>
                </tr>`;
            }
            document.getElementById('compare-tbody').innerHTML = html;
        }

        function initRateTabs() {
            const container = document.getElementById('rate-tabs');
            let html = '';
            Object.keys(pricingConfig).forEach(cpo => {
                html += `<button class="nav-btn ${cpo === currentRateCpo ? 'active' : ''}" onclick="changeRateCpo('${cpo}')" style="border:1px solid var(--border-color);">${cpo}</button>`;
            });
            container.innerHTML = html;
            renderRateMatrix();
        }

        function changeRateCpo(cpo) {
            currentRateCpo = cpo;
            initRateTabs();
        }

        function renderRateMatrix() {
            let html = '';
            for (let h = 0; h < 24; h++) {
                html += `<tr><td style="font-weight:bold;">${String(h).padStart(2,'0')}:00</td>`;
                for (let d = 1; d <= 7; d++) {
                    let p = getPrice(currentRateCpo, h, d >= 6);
                    let color = p > 9.0 ? '#ea580c' : (d >= 6 ? '#ca8a04' : '#16a34a');
                    html += `<td style="color:${color}; font-weight:600;">$${p.toFixed(1)}</td>`;
                }
                html += `</tr>`;
            }
            document.getElementById('rate-tbody').innerHTML = html;
        }

        async function loadNews() {
            const container = document.getElementById('news-container');
            try {
                const res = await fetch('./data/news.json?t=' + Date.now());
                const list = await res.json();
                let html = '';
                list.forEach(n => {
                    let col = n.cpo === 'EVOASIS' ? '#10b981' : (n.cpo === 'U-POWER' ? '#0369a1' : (n.cpo === 'Tesla' ? '#ef4444' : '#64748b'));
                    html += `
                    <div class="news-card">
                        <div class="news-cpo" style="color:${col}; border-color:${col};">${n.cpo}</div>
                        <div style="flex-grow:1;">
                            <a href="${n.url}" target="_blank" class="news-link">${n.title}</a>
                            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">🕒 發布時間：${n.date}</div>
                        </div>
                        <div style="font-size:16px;">🔗</div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:25px;">尚未產出 news.json 或本機直接開啟被 CORS 限制</div>';
            }
        }

        function runDiagClient() {
            const text = document.getElementById('log-input').value.trim();
            const out = document.getElementById('log-output');
            if (!text) return;
            out.style.display = 'block';

            const lower = text.toLowerCase();
            if (lower.includes("rejected")) {
                out.innerHTML = "<strong>🚨 連線遭拒 (BootNotification Rejected)</strong><br><br>💡 <b>處置建議：</b><br>1. 檢查 ChargePointID 與後台白名單配置。<br>2. 驗證 AuthorizationKey / 密碼與 OCPP 伺服器端配置是否一致。";
            } else if (lower.includes("faulted")) {
                out.innerHTML = "<strong>⚠️ 設備硬體故障 (StatusNotification Faulted)</strong><br><br>💡 <b>處置建議：</b><br>1. 檢查急停開關 (E-Stop) 是否遭按下。<br>2. 確認 AC/DC 模組通訊與接地迴路狀態。";
            } else {
                out.innerHTML = `<strong>✅ 通訊封包分析完成</strong><br><br>Log 長度 ${text.length} 字元，未發現即時致命特徵碼，格式正常。`;
            }
        }

        window.onload = () => { initData(); };
    </script>
</body>
</html>
