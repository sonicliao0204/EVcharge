<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 台灣充電站情報儀表板</title>
    <!-- 引入 Google Fonts 提升字體質感 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 基礎設定 */
        :root {
            --bg-color: #f3f6f9;
            --text-main: #333333;
            --text-muted: #888888;
            --card-bg: #ffffff;
            --border-color: #eaeaea;
            --primary-color: #2563eb;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        /* 頁面主容器 */
        .dashboard {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        /* 頂部標題區塊 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .last-update {
            font-size: 14px;
            color: var(--text-muted);
            background: #e2e8f0;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* 資料卡片與表格 */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
            padding: 16px 20px;
            font-size: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        /* 標籤視覺設計 */
        .cpo-tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        /* 依據不同 CPO 給予專屬品牌色 */
        .cpo-evoasis { background-color: #ecfccb; color: #4d7c0f; border: 1px solid #bef264; }
        .cpo-upower { background-color: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
        .cpo-default { background-color: #f1f5f9; color: #475569; }

        /* 規格與優惠小標籤 */
        .spec-tags {
            margin-top: 6px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .spec-tag {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: #f1f5f9;
            color: #64748b;
            border: 1px solid #cbd5e1;
        }
        
        .spec-tag.highlight { background-color: #fef3c7; color: #b45309; border-color: #fde68a; } /* 新站/優惠專用 */

        /* 連結設計 */
        .news-link {
            text-decoration: none;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
            display: block;
            transition: color 0.2s ease;
        }

        .news-link:hover {
            color: var(--primary-color);
        }
        
        .date-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* 載入中狀態 */
        #loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>⚡ 台灣充電情報站</h1>
            <div class="last-update" id="update-time">讀取資料中...</div>
        </div>
        
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th width="15%">營運商</th>
                        <th width="15%">日期</th>
                        <th width="70%">情報內容</th>
                    </tr>
                </thead>
                <tbody id="data-body">
                    <tr id="loading">
                        <td colspan="3">🔄 正在載入最新情報...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 設定 CPO 專屬的 CSS Class
        const getCpoClass = (cpoName) => {
            const name = cpoName.toUpperCase();
            if(name.includes('EVOASIS')) return 'cpo-evoasis';
            if(name.includes('U-POWER')) return 'cpo-upower';
            return 'cpo-default';
        };

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('data-body');
                tbody.innerHTML = ''; // 清除載入中文字
                
                // 設定更新時間為現在
                document.getElementById('update-time').innerText = '最後更新: ' + new Date().toLocaleString('zh-TW', {
                    month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                });
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 30px; color: #888;">目前尚無新情報</td></tr>';
                    return;
                }

                data.forEach(item => {
                    // 將標題與我們在 python 塞進去的中括號 [標籤] 分開處理
                    let mainTitle = item.title;
                    let tagsHtml = '';
                    
                    // 利用正規表達式捕捉 [標籤 | 標籤] 的內容
                    const tagMatch = item.title.match(/\[(.*?)\]/);
                    if (tagMatch) {
                        mainTitle = item.title.replace(tagMatch[0], '').trim(); // 把標題裡的 [標籤] 拔掉
                        const tagsList = tagMatch[1].split('|').map(t => t.trim());
                        
                        // 將標籤轉換為漂亮的 HTML 小方塊
                        tagsList.forEach(tag => {
                            const isHighlight = tag.includes('優惠') || tag.includes('新站') ? 'highlight' : '';
                            tagsHtml += `<span class="spec-tag ${isHighlight}">${tag}</span>`;
                        });
                    }

                    const row = `<tr>
                        <td>
                            <span class="cpo-tag ${getCpoClass(item.cpo)}">${item.cpo}</span>
                        </td>
                        <td class="date-text">${item.date}</td>
                        <td>
                            <a href="${item.url}" target="_blank" class="news-link">${mainTitle}</a>
                            ${tagsHtml ? `<div class="spec-tags">${tagsHtml}</div>` : ''}
                        </td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                document.getElementById('data-body').innerHTML = '<tr><td colspan="3" style="text-align:center; padding:30px; color:red;">無法取得 data.json，請確認爬蟲是否已成功執行。</td></tr>';
            });
    </script>
</body>
</html>
