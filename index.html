<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 台灣充電情報戰情室 V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* =========================================
           核心變數與基礎設定 (Premium SaaS 風格)
        ========================================= */
        :root { 
            --bg-color: #f8fafc; 
            --text-main: #0f172a; 
            --text-muted: #64748b;
            --card-bg: #ffffff; 
            --primary-color: #ef4444; 
            --primary-hover: #dc2626;
            --border-color: #e2e8f0; 
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 30px 20px; 
            display: flex; 
            justify-content: center; 
            -webkit-font-smoothing: antialiased;
        }

        .dashboard { width: 100%; max-width: 1200px; }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            padding-bottom: 20px; 
        }

        .header h1 { 
            margin: 0; 
            font-size: 32px; 
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex; 
            align-items: center; 
            gap: 12px;
        }

        .last-update { 
            font-size: 13px; 
            color: var(--text-muted); 
            background: #f1f5f9; 
            padding: 8px 16px; 
            border-radius: 30px; 
            font-weight: 500;
            border: 1px solid var(--border-color);
        }

        .main-nav { 
            display: inline-flex; 
            background: #f1f5f9; 
            padding: 6px; 
            border-radius: 16px;
            gap: 8px; 
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-btn { 
            min-width: 160px; 
            padding: 12px 24px; 
            font-size: 15px; 
            font-weight: 600; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            background: transparent; 
            color: var(--text-muted); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .nav-btn:hover { color: var(--text-main); }
        .nav-btn.active { 
            background: var(--card-bg); 
            color: var(--primary-color); 
            box-shadow: var(--shadow-sm); 
        }

        .section { 
            display: none; 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-md); 
            border: 1px solid rgba(255,255,255,0.8);
            animation: fadeIn 0.4s ease-out forwards;
        }
        .section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .news-list { display: flex; flex-direction: column; gap: 16px; }

        .news-card { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            padding: 20px 24px; 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-md); 
            transition: all 0.2s ease; 
            background: #fff; 
        }

        .news-card:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 12px 20px -8px rgb(0 0 0 / 0.08); 
            border-color: #cbd5e1; 
        }

        .news-cpo { 
            flex-shrink: 0; 
            width: 110px; 
            text-align: center; 
            padding: 8px 0; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .news-content { flex-grow: 1; }

        .news-link { 
            text-decoration: none; 
            color: var(--text-main); 
            font-size: 17px; 
            font-weight: 700; 
            display: block; 
            margin-bottom: 8px; 
            line-height: 1.4;
            transition: color 0.2s;
        }
        .news-link:hover { color: var(--primary-color); }

        .news-date { flex-shrink: 0; color: #94a3b8; font-size: 14px; font-weight: 500; text-align: right; }

        .spec-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .spec-tag { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #f1f5f9; color: var(--text-muted); font-weight: 600;}
        .spec-tag.highlight { background: #fee2e2; color: #b91c1c; }

        .cpo-fet { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .cpo-evalue { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .cpo-upower { background: #f0f9ff; color: #0284c7; border: 1px solid #bae6fd; }
        .cpo-icharging { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }
        .cpo-tail { background: #ecfeff; color: #0891b2; border: 1px solid #a5f3fc; }
        .cpo-yes { background: #fefce8; color: #ca8a04; border: 1px solid #fef08a; }

        .data-table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
            text-align: center; 
            border-radius: var(--radius-md); 
            overflow: hidden; 
            border: 1px solid var(--border-color);
        }

        .data-table th, .data-table td { 
            padding: 16px 12px; 
            font-size: 15px; 
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        .data-table th { 
            background: #f8fafc; 
            color: var(--text-muted); 
            font-weight: 700; 
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .data-table tr:last-child td { border-bottom: none; }
        .data-table th:last-child, .data-table td:last-child { border-right: none; }
        .data-table tbody tr:hover td { background-color: #f8fafc; }

        .time-col { background: #ffffff !important; color: var(--text-muted); font-weight: 600; width: 80px; }

        .col-fet { 
            background: #fffafa !important; 
            font-weight: 700; 
            border-left: 3px solid var(--primary-color) !important; 
            border-right: 3px solid var(--primary-color) !important; 
            font-size: 16px;
        }

        .cell-win { color: #059669; font-weight: 800; background: #ecfdf5; border-radius: 6px; padding: 4px 8px; display: inline-block;}
        .cell-tie { color: #2563eb; font-weight: 800; background: #eff6ff; border-radius: 6px; padding: 4px 8px; display: inline-block;}
        .cell-lose { color: #e11d48; font-weight: 800; background: #fff1f2; border-radius: 6px; padding: 4px 8px; display: inline-block;}

        .toggle-group { display: flex; justify-content: center; margin-bottom: 24px; gap: 0; background: #f1f5f9; border-radius: 12px; padding: 4px; width: fit-content; margin-left: auto; margin-right: auto;}
        .toggle-btn { padding: 10px 32px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; background: transparent; color: var(--text-muted); transition: 0.2s;}
        .toggle-btn.active { background: #ffffff; color: var(--text-main); box-shadow: var(--shadow-sm); }

        .chart-container { 
            background: #ffffff; 
            padding: 24px; 
            border-radius: var(--radius-md); 
            border: 1px solid var(--border-color); 
            height: 450px; 
            width: 100%; 
            position: relative; 
        }

        .cpo-tabs { display: flex; gap: 12px; margin-bottom: 24px; justify-content: center; flex-wrap: wrap; }
        .cpo-btn { padding: 10px 24px; border: 1.5px solid var(--border-color); background: white; border-radius: 30px; cursor: pointer; font-weight: 600; color: var(--text-muted); font-size: 14px; transition: 0.2s;}
        .cpo-btn:hover { border-color: #cbd5e1; color: var(--text-main); }

        .summary-cards { display: flex; gap: 20px; margin-bottom: 30px; text-align: center; }
        .rate-box { flex: 1; padding: 20px; border-top: 4px solid; border-radius: var(--radius-md); background: #ffffff; box-shadow: var(--shadow-sm); border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);}
        .rate-box-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase;}
        .rate-box-price { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -1px;}
        .unit { font-size: 16px; font-weight: 600; opacity: 0.8; margin-left: 4px;}

        .cell-off-peak { background: #f0fdf4; color: #16a34a; font-weight: 600; }
        .cell-peak { background: #fff7ed; color: #ea580c; font-weight: 600; }
        .cell-holiday { background: #fefce8; color: #ca8a04; font-weight: 600; }
        .cell-flat { background: #f0f9ff; color: #0284c7; font-weight: 600; }

        @media (max-width: 768px) {
            .section { padding: 20px; }
            .news-card { flex-direction: column; align-items: flex-start; gap: 12px;}
            .news-date { text-align: left; width: 100%; }
            .summary-cards { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>⚡ 台灣充電情報戰情室</h1>
            <div class="last-update" id="update-time">讀取資料中...</div>
        </div>
        
        <div class="main-nav">
            <button class="nav-btn active" onclick="switchMainTab('news')">📡 動態情報牆</button>
            <button class="nav-btn" onclick="switchMainTab('compare')">🔥 競品定價分析</button>
            <button class="nav-btn" onclick="switchMainTab('trend')">📈 量化趨勢分析</button>
            <button class="nav-btn" onclick="switchMainTab('rates')">💰 各家詳細費率</button>
        </div>

        <div id="section-news" class="section active">
            <div class="news-list" id="news-container">
                <div style="text-align:center; color:#888; padding: 20px;">載入情報中...</div>
            </div>
        </div>

        <div id="section-compare" class="section">
            <div class="toggle-group">
                <button id="toggle-weekday" class="toggle-btn active" onclick="renderCompare(false)">工作日 (週一~五)</button>
                <button id="toggle-weekend" class="toggle-btn" onclick="renderCompare(true)">週末假日 (六~日)</button>
            </div>
            <div style="text-align: center; margin-bottom: 15px; color: #64748b; font-size: 14px;">
                以 <strong>遠傳 (FET)</strong> 為基準，自動計算該時段對比競品最低價之優勢與劣勢。
            </div>
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="time-col">時間</th>
                            <th class="col-fet">遠傳 (基準)</th>
                            <th>EVALUE</th>
                            <th>iCharging</th>
                            <th>TAIL</th>
                            <th>U-POWER</th>
                            <th>YES!來電</th>
                            <th style="background:#f8fafc; color:#0f172a; width: 140px;">💡 優劣勢分析</th>
                        </tr>
                    </thead>
                    <tbody id="compare-tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="section-trend" class="section">
            <div style="text-align: center; margin-bottom: 20px; color: #64748b; font-size: 15px;">
                追蹤各家 CPO 近半年快充站建置累計數量，掌握市場擴張動能與資本投入斜率。
            </div>
            <div class="chart-container">
                <canvas id="expansionChart"></canvas>
            </div>
        </div>

        <div id="section-rates" class="section">
            <div class="cpo-tabs">
                <button id="btn-fet" class="cpo-btn" onclick="renderRate('FET')">遠傳 (時間)</button>
                <button id="btn-evalue" class="cpo-btn" onclick="renderRate('EVALUE')">EVALUE (時間)</button>
                <button id="btn-icharging" class="cpo-btn" onclick="renderRate('iCharging')">iCharging (時間)</button>
                <button id="btn-tail" class="cpo-btn" onclick="renderRate('TAIL')">TAIL (時間)</button>
                <button id="btn-upower" class="cpo-btn" onclick="renderRate('U-POWER')">U-POWER (單一)</button>
                <button id="btn-yes" class="cpo-btn" onclick="renderRate('YES')">YES!來電 (單一)</button>
            </div>
            <div class="summary-cards" id="rate-summary"></div>
            <div style="overflow-x: auto;">
                <table class="data-table" id="rate-table-ui">
                    <thead>
                        <tr><th class="time-col">時間</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th><th>週六</th><th>週日</th></tr>
                    </thead>
                    <tbody id="rate-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- 引入外部的 JavaScript 邏輯 -->
    <script src="js/app.js"></script>
</body>
</html>
