<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 台灣充電情報戰情室 V2.2 企業版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>⚡ 台灣充電情報戰情室 <span style="font-size: 14px; background: #fee2e2; color: #dc2626; padding: 4px 10px; border-radius: 20px; font-weight: 600;">V2.2 模組化</span></h1>
            <div class="last-update" id="update-time">讀取資料中...</div>
        </div>
        
        <div class="main-nav">
            <button class="nav-btn active" onclick="switchMainTab('overview')">📊 營運與市場概覽</button>
            <button class="nav-btn" onclick="switchMainTab('news')">📡 動態情報牆</button>
            <button class="nav-btn" onclick="switchMainTab('compare')">🔥 競品定價分析</button>
            <button class="nav-btn" onclick="switchMainTab('trend')">📈 量化趨勢分析</button>
            <button class="nav-btn" onclick="switchMainTab('rates')">💰 各家詳細費率</button>
        </div>

        <div id="section-overview" class="section active">
            <h3 style="margin-top:0; margin-bottom: 20px; font-size: 18px; color: var(--text-main);">新竹市智慧充電專案與全台 CPO 核心指標</h3>
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-title">遠傳站點涵蓋數 (FET)</div>
                    <div class="kpi-value" id="kpi-fet-stations">65 站</div>
                    <div class="kpi-desc">📈 較上月成長 +8.3%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">市場最低尖峰費率</div>
                    <div class="kpi-value">$10.9</div>
                    <div class="kpi-desc">🎯 遠傳具備競爭優勢</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">今日情報追蹤總數</div>
                    <div class="kpi-value" id="kpi-news-count">-- 筆</div>
                    <div class="kpi-desc">🔄 系統自動同步中</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">設備妥善率 (OCPP)</div>
                    <div class="kpi-value">99.4%</div>
                    <div class="kpi-desc">🟢 運行狀態良好</div>
                </div>
            </div>
        </div>

        <div id="section-news" class="section">
            <div class="news-list" id="news-container">
                <div style="text-align:center; color:#888; padding: 20px;">載入情報中...</div>
            </div>
        </div>

        <div id="section-compare" class="section">
            <div class="toggle-group">
                <button id="toggle-weekday" class="toggle-btn active" onclick="renderCompare(false)">工作日 (週一~五)</button>
                <button id="toggle-weekend" class="toggle-btn" onclick="renderCompare(true)">週末假日 (六~日)</button>
            </div>
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="time-col">時間</th>
                            <th class="col-fet">遠傳 (基準)</th>
                            <th>EVALUE</th>
                            <th>iCharging</th>
                            <th>TAIL</th>
                            <th>U-POWER</th>
                            <th>YES!來電</th>
                            <th style="background:#f8fafc; color:#0f172a; width: 130px;">💡 優劣勢分析</th>
                        </tr>
                    </thead>
                    <tbody id="compare-tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="section-trend" class="section">
            <div class="chart-container">
                <canvas id="expansionChart"></canvas>
            </div>
        </div>

        <div id="section-rates" class="section">
            <div class="cpo-tabs">
                <button id="btn-fet" class="cpo-btn" onclick="renderRate('FET')">遠傳 (時間)</button>
                <button id="btn-evalue" class="cpo-btn" onclick="renderRate('EVALUE')">EVALUE (時間)</button>
                <button id="btn-icharging" class="cpo-btn" onclick="renderRate('iCharging')">iCharging (時間)</button>
                <button id="btn-tail" class="cpo-btn" onclick="renderRate('TAIL')">TAIL (時間)</button>
                <button id="btn-upower" class="cpo-btn" onclick="renderRate('U-POWER')">U-POWER (單一)</button>
                <button id="btn-yes" class="cpo-btn" onclick="renderRate('YES')">YES!來電 (單一)</button>
            </div>
            <div class="summary-cards" id="rate-summary"></div>
            <div style="overflow-x: auto;">
                <table class="data-table" id="rate-table-ui">
                    <thead>
                        <tr><th class="time-col">時間</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th><th>週六</th><th>週日</th></tr>
                    </thead>
                    <tbody id="rate-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 引入 V2.2 獨立 JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
