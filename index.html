<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 12. SEO 與 Meta 標籤補齊 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="台灣充電情報戰情室 V2.2 - 提供全台電動車充電樁 CPO 費率分析、營運概況與 OCPP 智慧診斷">
    <meta property="og:title" content="⚡ 台灣充電情報戰情室 V2.2 企業版">
    <meta property="og:description" content="即時監控 CPO 站點與費率，內建 OCPP Log AI 診斷引擎。">
    <meta name="theme-color" content="#f8fafc" id="theme-color-meta">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <title>⚡ 台灣充電情報戰情室 V2.2 企業版</title>

    <!-- 5. 效能：字型 preconnect 預先連線 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- 3. 效能：移除同步載入的 Chart.js，改為點擊趨勢頁時按需動態載入 -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->

    <style>
        /* 7. UX：深色模式 (CSS 變數持久化設定) */
        :root { 
            --bg-color: #f8fafc; --text-main: #0f172a; --text-muted: #64748b; --card-bg: #ffffff; 
            --primary-color: #ef4444; --border-color: #e2e8f0; --btn-hover: #f1f5f9;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            --radius-md: 12px; --radius-lg: 20px;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a; --text-main: #f8fafc; --text-muted: #94a3b8; --card-bg: #1e293b; 
            --border-color: #334155; --btn-hover: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.5);
        }

        /* 11. a11y：Skip-link 隱藏跳轉連結與 Focus-visible 樣式 */
        .skip-link { position: absolute; top: -40px; left: 0; background: #000; color: white; padding: 8px; z-index: 100; transition: top 0.2s; }
        .skip-link:focus { top: 0; }
        *:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 2px; }

        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; transition: background-color 0.3s, color 0.3s; }
        .dashboard { width: 100%; max-width: 1200px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--border-color); flex-wrap: wrap; gap: 15px;}
        .header h1 { margin: 0; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .theme-toggle { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 50%; width: 40px; height: 40px; cursor: pointer; color: var(--text-main); font-size: 18px; transition: 0.2s; }
        .theme-toggle:hover { background: var(--btn-hover); }
        
        .last-update { font-size: 13px; color: var(--text-muted); background: var(--card-bg); padding: 8px 16px; border-radius: 30px; font-weight: 500; border: 1px solid var(--border-color); }
        .main-nav { display: inline-flex; background: var(--card-bg); border: 1px solid var(--border-color); padding: 6px; border-radius: 16px; gap: 6px; margin-bottom: 25px; flex-wrap: wrap; }
        .nav-btn { min-width: 120px; padding: 10px 16px; font-size: 14px; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; background: transparent; color: var(--text-muted); transition: all 0.3s; }
        .nav-btn:hover { background: var(--btn-hover); color: var(--text-main); }
        .nav-btn.active { background: var(--bg-color); color: var(--primary-color); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);}
        
        .section { display: none; background: var(--card-bg); padding: 25px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); animation: fadeIn 0.3s ease-out forwards; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* 10. UX：骨架屏 (Skeleton Loading) */
        .skeleton { background: linear-gradient(90deg, var(--btn-hover) 25%, var(--border-color) 50%, var(--btn-hover) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 4px; color: transparent !important; user-select: none; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* KPI & Cards */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; position: relative; overflow: hidden; }
        .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary-color); }
        .kpi-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .kpi-value { font-size: 26px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
        .kpi-desc { font-size: 12px; color: #16a34a; margin-top: 6px; font-weight: 600; }

        /* 9. UX：新聞搜尋與篩選器 */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 200px; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); }
        .cpo-select { padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); }

        .news-list { display: flex; flex-direction: column; gap: 12px; }
        .news-card { display: flex; align-items: center; gap: 15px; padding: 15px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--card-bg); transition: 0.2s; flex-wrap: wrap;}
        .news-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); border-color: var(--text-muted); }
        .news-cpo { flex-shrink: 0; width: 100px; text-align: center; padding: 4px 0; border-radius: 6px; font-weight: 700; font-size: 12px; }
        .news-content { flex-grow: 1; min-width: 250px;}
        .news-link { text-decoration: none; color: var(--text-main); font-size: 15px; font-weight: 700; display: block; margin-bottom: 6px; }
        .news-link:hover { color: var(--primary-color); text-decoration: underline; }
        .news-date { flex-shrink: 0; color: var(--text-muted); font-size: 12px; text-align: right; }
        .spec-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .spec-tag { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--bg-color); color: var(--text-muted); font-weight: 600; border: 1px solid var(--border-color);}

        /* CPO Colors */
        .cpo-gov { background: #334155; color: #fff; border: 1px solid #1e293b; } 
        .cpo-fet { background: #dc2626; color: #fff; border: 1px solid #b91c1c; }
        .cpo-evalue { background: #16a34a; color: #fff; border: 1px solid #15803d; }
        .cpo-upower { background: #0284c7; color: #fff; border: 1px solid #0369a1; }
        .cpo-icharging { background: #ea580c; color: #fff; border: 1px solid #c2410c; }
        .cpo-tail { background: #0891b2; color: #fff; border: 1px solid #0e7490; }
        .cpo-yes { background: #ca8a04; color: #fff; border: 1px solid #a16207; }

        /* 8. UX：資料表水平滑動防爆框 */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
        .data-table { width: 100%; min-width: 800px; border-collapse: collapse; text-align: center; }
        .data-table th, .data-table td { padding: 12px 10px; font-size: 14px; border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
        .data-table th { background: var(--bg-color); color: var(--text-muted); font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .time-col { background: var(--card-bg); color: var(--text-muted); font-weight: 600; width: 75px; position: sticky; left: 0; z-index: 2;}
        
        .log-textarea { width: 100%; height: 140px; padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; font-family: monospace; font-size: 13px; margin-bottom: 15px; background: var(--bg-color); color: var(--text-main); }
        .log-textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1); }
        .btn-analyze { background: var(--primary-color); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-analyze:hover { background: #dc2626; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">跳至主要內容</a>

    <div class="dashboard">
        <header class="header">
            <h1>⚡ 台灣充電情報戰情室 <span style="font-size: 12px; background: var(--primary-color); color: white; padding: 3px 8px; border-radius: 12px;">V2.2 企業版</span></h1>
            <div class="header-actions">
                <div class="last-update" id="update-time" aria-live="polite">資料同步中...</div>
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="切換深淺色模式" id="theme-btn">🌓</button>
            </div>
        </header>
        
        <nav class="main-nav" role="tablist">
            <!-- 1. Bug修復：使用顯式傳遞 event，支援鍵盤操作 -->
            <button class="nav-btn active" role="tab" aria-selected="true" onclick="switchMainTab('overview', event)" onkeydown="handleTabKey(event, 'overview')">📊 營運與市場</button>
            <button class="nav-btn" role="tab" aria-selected="false" onclick="switchMainTab('news', event)" onkeydown="handleTabKey(event, 'news')">📡 情報牆</button>
            <button class="nav-btn" role="tab" aria-selected="false" onclick="switchMainTab('compare', event)" onkeydown="handleTabKey(event, 'compare')">🔥 競品定價</button>
            <button class="nav-btn" role="tab" aria-selected="false" onclick="switchMainTab('trend', event)" onkeydown="handleTabKey(event, 'trend')">📈 趨勢分析</button>
            <button class="nav-btn" role="tab" aria-selected="false" onclick="switchMainTab('rates', event)" onkeydown="handleTabKey(event, 'rates')">💰 詳細費率</button>
            <button class="nav-btn" role="tab" aria-selected="false" onclick="switchMainTab('kb', event)" onkeydown="handleTabKey(event, 'kb')">🛠️ AI 診斷</button>
        </nav>

        <main id="main-content">
            <section id="section-overview" class="section active" role="tabpanel">
                <h3 style="margin-top:0; color: var(--text-main);">內部營運與全台 CPO 核心指標</h3>
                <div class="kpi-grid">
                    <div class="kpi-card"><div class="kpi-title">遠傳站點數</div><div class="kpi-value skeleton" id="kpi-fet-stations">00 站</div><div class="kpi-desc" id="kpi-fet-growth">--</div></div>
                    <div class="kpi-card"><div class="kpi-title">市場最低尖峰費率</div><div class="kpi-value skeleton" id="kpi-lowest-rate">$00.0</div><div class="kpi-desc" id="kpi-lowest-cpo">--</div></div>
                    <div class="kpi-card"><div class="kpi-title">今日情報數</div><div class="kpi-value skeleton" id="kpi-news-count">00 筆</div><div class="kpi-desc">--</div></div>
                    <div class="kpi-card"><div class="kpi-title">妥善率 (OCPP)</div><div class="kpi-value skeleton" id="kpi-ocpp">00.0%</div><div class="kpi-desc" id="kpi-ocpp-status">--</div></div>
                </div>
            </section>

            <section id="section-news" class="section" role="tabpanel">
                <!-- 9. UX：情報牆搜尋過濾器 -->
                <div class="filter-bar">
                    <input type="text" id="news-search" class="search-input" placeholder="🔍 搜尋關鍵字 (如: 降價、新站)..." onkeyup="filterNews()">
                    <select id="news-cpo-filter" class="cpo-select" onchange="filterNews()">
                        <option value="all">所有來源</option>
                    </select>
                </div>
                <div class="news-list" id="news-container">
                    <div style="text-align:center; color:var(--text-muted); padding:20px;">資料載入中...</div>
                </div>
            </section>

            <section id="section-compare" class="section" role="tabpanel">
                <div style="margin-bottom:15px; display:flex; gap:10px;">
                    <button class="nav-btn active" id="btn-weekday" style="min-width:auto; padding:6px 12px;" onclick="renderCompare(false)">工作日</button>
                    <button class="nav-btn" id="btn-weekend" style="min-width:auto; padding:6px 12px;" onclick="renderCompare(true)">週末</button>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead><tr><th class="time-col">時間</th><th>遠傳</th><th>EVALUE</th><th>iCharging</th><th>TAIL</th><th>U-POWER</th><th>YES!來電</th><th>優勢</th></tr></thead>
                        <tbody id="compare-tbody"></tbody>
                    </table>
                </div>
            </section>

            <section id="section-trend" class="section" role="tabpanel">
                <div class="chart-container" style="height: 400px; background:var(--card-bg); border-radius:var(--radius-md); padding:10px;">
                    <canvas id="expansionChart"></canvas>
                </div>
            </section>

            <section id="section-rates" class="section" role="tabpanel">
                <div style="margin-bottom: 15px; display:flex; gap:8px; overflow-x:auto;" id="rate-tabs-container"></div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead><tr><th class="time-col">時段</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th><th>週六</th><th>週日</th></tr></thead>
                        <tbody id="rate-tbody"></tbody>
                    </table>
                </div>
            </section>

            <section id="section-kb" class="section" role="tabpanel">
                <div style="background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 25px; margin-bottom: 30px;">
                    <h4 style="margin-top:0; color: var(--text-main);">🤖 OCPP Log 智慧診斷引擎 (RAG / 容錯降級)</h4>
                    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">貼上 WebSocket Log。系統將優先呼叫本地 Python API，若連線失敗則啟動前端備援規則庫。</p>
                    <textarea id="ocpp-log-input" class="log-textarea" placeholder="貼上 Log，例如: [3, '19223201', {'status':'Rejected'}]"></textarea>
                    <button class="btn-analyze" onclick="analyzeOcppLog()">🔍 發送診斷</button>
                    <div id="log-result" style="display:none; margin-top:20px; padding:15px; border-radius:8px; border-left:4px solid var(--primary-color); background:var(--card-bg);"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // 全域變數
        let allNewsData = [];
        let cpoPricingData = {};
        let techKbData = [];
        let trendChartInstance = null;
        let isChartJsLoaded = false;

        // 7. UX：深淺色模式持久化邏輯
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('theme-color-meta').content = '#0f172a';
            }
        }
        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('theme-color-meta').content = isDark ? '#f8fafc' : '#0f172a';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
            if(trendChartInstance) trendChartInstance.update(); // 觸發圖表顏色重繪
        }
        initTheme();

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            fetchData('data/stations.json', populateKpis, fallbackKpi);
            fetchData('data/market.json', setupNews, fallbackNews);
            fetchData('data/pricing.json', setupPricing, fallbackPricing);
            fetchData('data/tech_kb.json', data => { techKbData = data; }, () => { techKbData = []; });
        });

        // 共用 Fetch 函式 (附帶 10. 錯誤重試與骨架屏解除)
        async function fetchData(url, onSuccess, onFail) {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Network response was not ok');
                const data = await res.json();
                onSuccess(data);
            } catch (e) {
                console.warn(`${url} 載入失敗，啟動降級備援:`, e);
                onFail();
            }
        }

        // 1. Bug：顯式 Event 綁定與鍵盤支援
        function switchMainTab(tabName, event) {
            document.querySelectorAll('.nav-btn').forEach(btn => { 
                btn.classList.remove('active'); 
                btn.setAttribute('aria-selected', 'false');
            });
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('active');
                event.currentTarget.setAttribute('aria-selected', 'true');
            }
            document.getElementById('section-' + tabName).classList.add('active');
            
            // 延遲渲染表格/圖表
            if(tabName === 'rates' && document.getElementById('rate-tbody').innerHTML === '') renderRate('FET');
            if(tabName === 'compare' && document.getElementById('compare-tbody').innerHTML === '') renderCompare(false);
            if(tabName === 'trend') loadChartJsAndRender();
        }

        function handleTabKey(event, tabName) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                switchMainTab(tabName, event);
            }
        }

        // 3. 效能：按需載入 Chart.js
        function loadChartJsAndRender() {
            if (isChartJsLoaded) { renderTrendChart(); return; }
            const script = document.createElement('script');
            script.src = "https://cdn.jsdelivr.net/npm/chart.js";
            script.onload = () => { isChartJsLoaded = true; renderTrendChart(); };
            document.head.appendChild(script);
        }

        // --- KPI 邏輯 ---
        function populateKpis(data) {
            document.querySelectorAll('.kpi-value').forEach(el => el.classList.remove('skeleton'));
            document.getElementById('kpi-fet-stations').innerText = data.fet_stations + ' 站';
            document.getElementById('kpi-fet-growth').innerText = data.fet_growth_rate;
            document.getElementById('kpi-lowest-rate').innerText = '$' + data.lowest_peak_rate;
            document.getElementById('kpi-lowest-cpo').innerText = data.lowest_peak_cpo;
            document.getElementById('kpi-ocpp').innerText = data.ocpp_availability + '%';
            document.getElementById('update-time').innerText = '最後更新: ' + new Date().toLocaleString('zh-TW', {hour12:false});
        }
        function fallbackKpi() {
            populateKpis({fet_stations: 65, fet_growth_rate: "靜態展示模式", lowest_peak_rate: 10.9, lowest_peak_cpo: "遠傳 (基準)", ocpp_availability: 99.4});
        }

        // --- 新聞與 6. 標題清洗 9. 搜尋過濾 ---
        function setupNews(data) {
            allNewsData = data;
            document.getElementById('kpi-news-count').innerText = data.length + ' 筆';
            
            // 建立 CPO 下拉選單
            const cpos = [...new Set(data.map(item => item.cpo))];
            const select = document.getElementById('news-cpo-filter');
            cpos.forEach(cpo => {
                let opt = document.createElement('option');
                opt.value = cpo; opt.text = cpo;
                select.appendChild(opt);
            });
            renderNews(allNewsData);
        }
        function fallbackNews() { document.getElementById('news-container').innerHTML = '無歷史情報。'; }

        function filterNews() {
            const query = document.getElementById('news-search').value.toLowerCase();
            const cpoFilter = document.getElementById('news-cpo-filter').value;
            const filtered = allNewsData.filter(item => {
                const matchQuery = item.title.toLowerCase().includes(query);
                const matchCpo = cpoFilter === 'all' || item.cpo === cpoFilter;
                return matchQuery && matchCpo;
            });
            renderNews(filtered);
        }

        function renderNews(data) {
            const container = document.getElementById('news-container');
            if (data.length === 0) { container.innerHTML = '<div style="padding:20px; text-align:center;">無符合條件之情報</div>'; return; }
            
            // 4. 效能：字串累加替換 += DOM 操作
            let html = '';
            data.forEach(item => {
                // 6. UX：清洗標題雜訊 (如日期、公版括號)
                let cleanTitle = item.title.replace(/202\d[/-]\d{1,2}[/-]\d{1,2}|【.*?】|\[.*?\]/g, '').trim();
                let tagsHtml = '';
                const tagMatch = item.title.match(/\[(.*?)\]/);
                if (tagMatch) {
                    tagMatch[1].split('|').forEach(t => {
                        let c = 'spec-tag';
                        if(t.includes('政策')) c += ' policy';
                        if(t.includes('新站') || t.includes('優惠')) c += ' highlight';
                        tagsHtml += `<span class="${c}">${t.trim()}</span>`;
                    });
                }
                const cpoClass = `cpo-${item.cpo.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
                html += `
                    <div class="news-card">
                        <div class="news-cpo ${cpoClass}" style="background:var(--primary-color);color:#fff;">${item.cpo}</div>
                        <div class="news-content">
                            <a href="${item.url}" target="_blank" class="news-link">${cleanTitle}</a>
                            <div class="spec-tags">${tagsHtml}</div>
                        </div>
                        <div class="news-date">${item.date}</div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        // --- 費率比價與 4. 迴圈重構 ---
        function setupPricing(data) { cpoPricingData = data; buildRateTabs(); }
        function fallbackPricing() {
            cpoPricingData = {
                'FET': {'type': 'TOU', 'peak': 10.9, 'offPeak': 6.8, 'holiday': 7.9, 'peakStart': 16, 'peakEnd': 21},
                'EVALUE': {'type': 'TOU', 'peak': 13.5, 'offPeak': 6.9, 'holiday': 8.5, 'peakStart': 16, 'peakEnd': 21},
                'U-POWER': {'type': 'FLAT', 'price': 9.9}
            };
            buildRateTabs();
        }

        function buildRateTabs() {
            const container = document.getElementById('rate-tabs-container');
            let html = '';
            Object.keys(cpoPricingData).forEach((cpo, idx) => {
                html += `<button class="nav-btn ${idx===0?'active':''}" onclick="renderRate('${cpo}', event)" style="min-width:auto; padding:6px 15px;">${cpo}</button>`;
            });
            container.innerHTML = html;
        }

        function getPrice(cpo, hour, isWeekend) {
            const conf = cpoPricingData[cpo];
            if (!conf) return 0;
            if (conf.type === 'FLAT') return conf.price;
            if (isWeekend) return conf.holiday || conf.offPeak;
            return (hour >= conf.peakStart && hour <= conf.peakEnd) ? conf.peak : conf.offPeak;
        }

        function renderCompare(isWeekend) {
            document.getElementById('btn-weekday').className = 'nav-btn ' + (!isWeekend?'active':'');
            document.getElementById('btn-weekend').className = 'nav-btn ' + (isWeekend?'active':'');
            const cpos = Object.keys(cpoPricingData);
            if(cpos.length === 0) return;

            let html = '';
            for (let h = 0; h < 24; h++) {
                const prices = cpos.map(cpo => getPrice(cpo, h, isWeekend));
                const min = Math.min(...prices.slice(1));
                const diff = (prices[0] - min).toFixed(1);
                
                html += `<tr><td class="time-col">${String(h).padStart(2,'0')}:00</td>`;
                prices.forEach((p, i) => {
                    html += `<td style="${i===0?'font-weight:bold; color:var(--primary-color);':''}color:var(--text-main);">$${p.toFixed(1)}</td>`;
                });
                
                if (prices[0] < min) html += `<td><span style="color:#16a34a;">🏆 勝 ($${Math.abs(diff)})</span></td></tr>`;
                else if (prices[0] === min) html += `<td><span style="color:#0ea5e9;">🤝 平</span></td></tr>`;
                else html += `<td><span style="color:#dc2626;">⚠️ 輸 ($${diff})</span></td></tr>`;
            }
            document.getElementById('compare-tbody').innerHTML = html;
        }

        function renderRate(cpo, event) {
            if(event) {
                document.getElementById('rate-tabs-container').querySelectorAll('button').forEach(b => b.classList.remove('active'));
                event.currentTarget.classList.add('active');
            }
            let html = '';
            for (let h = 0; h < 24; h++) {
                html += `<tr><td class="time-col">${String(h).padStart(2,'0')}:00</td>`;
                for (let d = 1; d <= 7; d++) {
                    let p = getPrice(cpo, h, d >= 6);
                    let color = p > 10 ? '#ea580c' : (d>=6 ? '#ca8a04' : '#16a34a');
                    html += `<td style="color:${color}; font-weight:600;">$${p.toFixed(1)}</td>`;
                }
                html += `</tr>`;
            }
            document.getElementById('rate-tbody').innerHTML = html;
        }

        function renderTrendChart() {
            fetchData('data/price_history.json', data => {
                const ctx = document.getElementById('expansionChart').getContext('2d');
                if(trendChartInstance) trendChartInstance.destroy();
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                Chart.defaults.color = isDark ? '#94a3b8' : '#64748b';
                
                trendChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [
                            { label: '遠傳', data: data.datasets['FET'], borderColor: '#ef4444', tension: 0.3, fill:true, backgroundColor: 'rgba(239, 68, 68, 0.1)' },
                            { label: 'U-POWER', data: data.datasets['U-POWER'], borderColor: '#0369a1', tension: 0.3 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }, () => console.log('趨勢圖表無資料'));
        }

        // 2. 致命 Bug 修復：OCPP API 容錯降級設計 (API 失敗直接切換前端規則引擎)
        async function analyzeOcppLog() {
            const logText = document.getElementById('ocpp-log-input').value.trim();
            const resultDiv = document.getElementById('log-result');
            
            if (!logText) {
                resultDiv.style.display = 'block'; resultDiv.style.borderLeftColor = '#ea580c';
                resultDiv.innerHTML = '請輸入 Log 內容。'; return;
            }

            resultDiv.style.display = 'block'; resultDiv.style.borderLeftColor = '#8b5cf6';
            resultDiv.innerHTML = '📡 正在嘗試呼叫 AI 後端 API...';

            try {
                // 設定 3 秒 Timeout，避免 GitHub Pages 卡死
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                
                const response = await fetch('http://localhost:8000/analyze_log', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ log_content: logText }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error('API 回應異常');
                const data = await response.json();
                resultDiv.style.borderLeftColor = "#10b981"; 
                resultDiv.innerHTML = data.diagnosis_html;
            } catch (error) {
                // 核心降級機制：改用前端比對 tech_kb.json 內容
                resultDiv.style.borderLeftColor = "#f59e0b";
                resultDiv.innerHTML = `<div style="color:var(--text-muted); font-size:12px; margin-bottom:8px;">⚠️ API 連線逾時，已切換至「前端備援規則庫」比對。</div>` 
                                    + runFrontendRuleEngine(logText);
            }
        }

        // 獨立的前端診斷規則引擎
        function runFrontendRuleEngine(log) {
            const lowerLog = log.toLowerCase();
            let match = techKbData.find(kb => {
                let kw = kb.issue.toLowerCase().split(' ')[0]; // 簡易抓取 issue 第一個詞
                return lowerLog.includes(kw) || (lowerLog.includes('rejected') && kb.issue.includes('連線拒絕'));
            });

            if(lowerLog.includes('rejected')) {
                return `<strong>🚨 連線驗證遭拒 (BootNotification Rejected)</strong><br><br>💡 <strong>備援對策：</strong><br>1. 檢查 ChargePointID 是否相符。<br>2. 檢查 Authorization Key 密碼設定。`;
            } else if (lowerLog.includes('faulted')) {
                return `<strong>⚠️ 設備硬體異常 (Faulted)</strong><br><br>💡 <strong>備援對策：</strong>檢查急停按鈕或配電盤供電。`;
            }
            return `<strong>✅ 未偵測到嚴重異常特徵碼。</strong><br><br>💡 若持續無法連線，請匯出完整 pcap 封包交由 L2 分析。`;
        }
    </script>
