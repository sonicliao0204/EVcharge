<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="台灣充電情報戰情室 V3.0 - PlugShare 企業版">
    <title>⚡ 台灣充電情報戰情室 V3.0 企業版</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        :root { 
            --bg-color: #f8fafc; --text-main: #0f172a; --text-muted: #64748b; --card-bg: #ffffff; 
            --primary-color: #ef4444; --border-color: #e2e8f0; --btn-hover: #f1f5f9;
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.05); --radius-md: 12px; --radius-lg: 20px;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a; --text-main: #f8fafc; --text-muted: #94a3b8; --card-bg: #1e293b; 
            --border-color: #334155; --btn-hover: #334155;
        }
        [data-theme="dark"] .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 1200px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--border-color); }
        .header h1 { margin: 0; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .main-nav { display: flex; background: var(--card-bg); border: 1px solid var(--border-color); padding: 6px; border-radius: 16px; gap: 6px; margin-bottom: 25px; flex-wrap: wrap; }
        .nav-btn { min-width: 110px; padding: 10px 14px; font-size: 14px; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; background: transparent; color: var(--text-muted); }
        .nav-btn.active { background: var(--bg-color); color: var(--primary-color); border: 1px solid var(--border-color);}
        .section { display: none; background: var(--card-bg); padding: 25px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
        .section.active { display: block; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; border-left: 4px solid var(--primary-color); }
        .kpi-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .kpi-value { font-size: 26px; font-weight: 800; color: var(--text-main); }
        .kpi-desc { font-size: 12px; color: #16a34a; margin-top: 6px; font-weight: 600; }

        .sync-btn { background: #8b5cf6; color: white; border: none; cursor: pointer; padding: 10px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: 0.2s;}
        .sync-btn:hover { background: #7c3aed; }
        
        .data-table { width: 100%; min-width: 900px; border-collapse: collapse; text-align: center; }
        .data-table th, .data-table td { padding: 12px; border-bottom: 1px solid var(--border-color); }
        .data-table th { background: var(--bg-color); font-weight: 700; font-size: 13px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <h1>⚡ 台灣充電情報戰情室 <span style="font-size: 12px; background: #8b5cf6; color: white; padding: 3px 8px; border-radius: 12px;">V3.0 PlugShare 企業版</span></h1>
            <button class="nav-btn" onclick="toggleTheme()" style="min-width:auto;">🌓 切換深色</button>
        </header>
        
        <nav class="main-nav">
            <button class="nav-btn active" onclick="switchTab('map')">🗺️ 全台站點地圖</button>
            <button class="nav-btn" onclick="switchTab('trend')">📊 各家數量排行</button>
            <button class="nav-btn" onclick="switchTab('compare')">🔥 競品定價分析</button>
        </nav>

        <main>
            <!-- 地圖與 KPI 區塊 -->
            <section id="section-map" class="section active">
                <div class="kpi-grid">
                    <div class="kpi-card"><div class="kpi-title">總收錄站點 (PlugShare)</div><div class="kpi-value" id="kpi-total-stations">-- 站</div><div class="kpi-desc">涵蓋全台各家 CPO</div></div>
                    <div class="kpi-card" style="border-left-color:#10b981;"><div class="kpi-title">EVOASIS 站點數</div><div class="kpi-value" id="kpi-evo-stations">-- 站</div><div class="kpi-desc">即時數量統計</div></div>
                    <div class="kpi-card" style="border-left-color:#0369a1;"><div class="kpi-title">U-POWER 站點數</div><div class="kpi-value" id="kpi-u-stations">-- 站</div><div class="kpi-desc">即時數量統計</div></div>
                </div>

                <div style="background: var(--bg-color); padding: 15px; border-radius: var(--radius-md); border: 1px dashed var(--border-color); margin-bottom: 15px; display: flex; gap: 15px; align-items: center;">
                    <button class="sync-btn" onclick="syncPlugShare()">🔄 一鍵同步 PlugShare 真實數據</button>
                    <span id="sync-status" style="font-size: 14px; font-weight: 600;"></span>
                </div>
                
                <div style="font-size: 13px; margin-bottom: 10px; font-weight: 600;">
                    <span style="color:#16a34a;">🟢 可用</span> | <span style="color:#0ea5e9;">⚡ 充電中</span> | <span style="color:#dc2626;">🔴 異常/離線</span>
                </div>
                <div id="station-map" style="height: 550px; width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border-color); z-index: 1;"></div>
            </section>

            <!-- 圖表區塊 -->
            <section id="section-trend" class="section">
                <h3 style="margin-top:0;">全台營運商站點數量即時排行</h3>
                <div style="height: 450px;"><canvas id="expansionChart"></canvas></div>
            </section>

            <!-- 定價區塊 -->
            <section id="section-compare" class="section">
                <h3 style="margin-top:0;">各家營運商尖離峰費率模擬表</h3>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>時段</th><th>遠傳</th><th>EVALUE</th><th style="color:#10b981;">EVOASIS</th><th>TAIL</th><th>U-POWER</th><th>🤖 AI 建議</th>
                            </tr>
                        </thead>
                        <tbody id="compare-tbody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let mapInstance = null, markersLayer = null, chartInstance = null;
        let currentStations = [];

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            if(chartInstance) updateRealChart();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('section-' + tabId).classList.add('active');
            if(tabId === 'map') setTimeout(() => mapInstance.invalidateSize(), 100);
        }

        function initMap() {
            mapInstance = L.map('station-map').setView([23.8, 120.9], 7);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
            markersLayer = new L.FeatureGroup().addTo(mapInstance);
            
            // 啟動時先嘗試載入既有檔案
            fetch('http://localhost:8000/data/stations_live.json')
                .then(res => res.json())
                .then(data => { currentStations = data; renderData(); })
                .catch(e => document.getElementById('sync-status').innerText = "💡 請點擊按鈕同步最新資料");
        }

        async function syncPlugShare() {
            const status = document.getElementById('sync-status');
            status.innerText = "📡 正在從 PlugShare 抓取全台資料，請稍候...";
            status.style.color = "#8b5cf6";
            try {
                const res = await fetch('http://localhost:8000/sync_plugshare', { method: 'POST' });
                if(!res.ok) throw new Error("伺服器連線失敗");
                const result = await res.json();
                
                const dataRes = await fetch('http://localhost:8000/data/stations_live.json');
                currentStations = await dataRes.json();
                
                renderData();
                status.innerText = `✅ ${result.message} (共 ${result.count} 站)`;
                status.style.color = "#16a34a";
            } catch (err) {
                status.innerText = "❌ 發生錯誤，請確認 rag_api.py 是否開啟";
                status.style.color = "#dc2626";
            }
        }

        function renderData() {
            // 1. 渲染地圖
            markersLayer.clearLayers();
            let cpoCounts = { 'EVOASIS': 0, 'U-POWER': 0, 'EVALUE': 0, 'TAIL': 0, 'iCharging': 0, 'YES': 0, 'FET': 0, '其他': 0 };
            
            currentStations.forEach(st => {
                let color = '#64748b', statusText = '⚫ 離線';
                if(st.status === 'Available') { color = '#16a34a'; statusText = '🟢 可用'; }
                else if(st.status === 'Charging') { color = '#0ea5e9'; statusText = '⚡ 充電中'; }
                else if(st.status === 'Faulted') { color = '#dc2626'; statusText = '🔴 異常'; }

                L.circleMarker([st.lat, st.lng], { radius: 6, fillColor: color, color: '#fff', weight: 1, fillOpacity: 0.9 })
                    .bindPopup(`<b>${st.name}</b><br>營運商: ${st.cpo}<br>最高功率: ${st.total_kw} kW<br>總槍數: ${st.total_plugs}<br>狀態: ${statusText}`)
                    .addTo(markersLayer);
                
                if (cpoCounts[st.cpo] !== undefined) cpoCounts[st.cpo]++;
                else cpoCounts['其他']++;
            });

            // 2. 更新 KPI
            document.getElementById('kpi-total-stations').innerText = currentStations.length + " 站";
            document.getElementById('kpi-evo-stations').innerText = cpoCounts['EVOASIS'] + " 站";
            document.getElementById('kpi-u-stations').innerText = cpoCounts['U-POWER'] + " 站";

            // 3. 更新圖表
            updateRealChart(cpoCounts);
        }

        function updateRealChart(cpoCounts) {
            if(!cpoCounts) return;
            const ctx = document.getElementById('expansionChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            Chart.defaults.color = document.documentElement.getAttribute('data-theme') === 'dark' ? '#94a3b8' : '#64748b';
            
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['EVOASIS', 'EVALUE', 'U-POWER', 'TAIL', 'YES!來電', 'iCharging', '其他'],
                    datasets: [{
                        label: '全台即時營運站點數 (資料來源: PlugShare)',
                        data: [cpoCounts['EVOASIS'], cpoCounts['EVALUE'], cpoCounts['U-POWER'], cpoCounts['TAIL'], cpoCounts['YES'], cpoCounts['iCharging'], cpoCounts['其他']],
                        backgroundColor: ['#10b981', '#16a34a', '#0369a1', '#0891b2', '#ca8a04', '#ea580c', '#64748b'],
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderPricing() {
            let html = '';
            for(let h=0; h<24; h++) {
                let p_fet = h>=16&&h<=21 ? 10.9 : 6.8;
                let p_evo = h>=16&&h<=21 ? 11.5 : 7.5;
                let p_upower = 9.9;
                let rec = Math.max(p_evo - 0.1, 6.5);
                
                html += `<tr>
                    <td style="font-weight:bold;">${String(h).padStart(2,'0')}:00</td>
                    <td>$${p_fet.toFixed(1)}</td><td>$${(p_fet+1).toFixed(1)}</td>
                    <td style="font-weight:bold; color:#10b981;">$${p_evo.toFixed(1)}</td>
                    <td>$8.9</td><td>$${p_upower.toFixed(1)}</td>
                    <td style="background:#fefce8; border-left:2px solid #ca8a04; font-weight:bold; color:#ca8a04;">
                        $${rec.toFixed(1)} (競價建議)
                    </td>
                </tr>`;
            }
            document.getElementById('compare-tbody').innerHTML = html;
        }

        window.onload = () => { initMap(); renderPricing(); };
    </script>
</body>
</html>
