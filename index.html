<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 台灣充電情報站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f4f7f6; --text-main: #333; --card-bg: #ffffff; --primary-color: #2563eb; --border-color: #eaeaea; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 1000px; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border-color); }
        .header h1 { margin: 0; font-size: 28px; color: #1e293b; }
        .last-update { font-size: 14px; color: #888; background: #e2e8f0; padding: 4px 12px; border-radius: 20px; }
        
        /* 導覽與區塊 */
        .main-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #e2e8f0; color: #475569; transition: 0.3s; }
        .nav-btn.active { background: var(--primary-color); color: white; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
        .section { display: none; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .section.active { display: block; }

        /* --- 情報表格與專屬標籤色 --- */
        .news-table { width: 100%; border-collapse: collapse; text-align: left; }
        .news-table th { background: #f8fafc; padding: 14px; border-bottom: 1px solid var(--border-color); color: #475569; }
        .news-table td { padding: 14px; border-bottom: 1px solid var(--border-color); }
        .news-table tr:hover { background: #f8fafc; }
        .cpo-tag { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        
        .cpo-evalue { background: #ecfccb; color: #4d7c0f; border: 1px solid #bef264; }
        .cpo-upower { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
        .cpo-icharging { background: #ffedd5; color: #c2410c; border: 1px solid #fdba74; }
        .cpo-tail { background: #cffafe; color: #0891b2; border: 1px solid #67e8f9; }
        .cpo-yes { background: #fef08a; color: #a16207; border: 1px solid #fde047; }
        .cpo-default { background: #f1f5f9; color: #475569; }

        .spec-tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; margin-right: 4px; display: inline-block; margin-top: 4px;}
        .spec-tag.highlight { background: #fef3c7; color: #b45309; border-color: #fde68a; }
        .news-link { text-decoration: none; color: var(--text-main); font-weight: 500; }
        .news-link:hover { color: var(--primary-color); }

        /* --- 費率區塊 UI --- */
        .cpo-tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .cpo-btn { padding: 8px 18px; border: 2px solid #cbd5e1; background: white; border-radius: 20px; cursor: pointer; font-weight: bold; color: #64748b; font-size: 14px; }
        /* 各按鈕選取時的顏色會由 JS 動態賦予 */

        .summary-cards { display: flex; gap: 15px; margin-bottom: 20px; text-align: center; }
        .rate-box { flex: 1; padding: 15px; border: 3px solid; border-radius: 8px; background: white; }
        .rate-box-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .rate-box-price { font-size: 28px; font-weight: bold; }
        .unit { font-size: 16px; font-weight: normal; }

        .rate-table { width: 100%; border-collapse: collapse; text-align: center; border: 2px solid #03A9F4; }
        .rate-table th, .rate-table td { border: 1px solid #ccc; padding: 8px 4px; font-size: 14px; }
        .rate-table th { background: white; color: #555; font-weight: bold; padding: 12px; }
        .time-col { background: #e1f5fe; color: #0277bd; font-weight: bold; width: 80px; }

        .cell-off-peak { background: #66BB6A; color: white; font-weight: 500; }
        .cell-peak { background: #FF7043; color: white; font-weight: 500; }
        .cell-holiday { background: #AED581; color: #33691E; font-weight: 500; }
        .cell-flat { background: #38bdf8; color: white; font-weight: 500; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>⚡ 台灣充電情報站</h1>
            <div class="last-update" id="update-time">讀取資料中...</div>
        </div>
        
        <div class="main-nav">
            <button class="nav-btn active" onclick="switchMainTab('news')">📡 最新情報 (5大CPO)</button>
            <button class="nav-btn" onclick="switchMainTab('rates')">💰 各家費率總覽</button>
        </div>

        <!-- 最新情報區塊 -->
        <div id="section-news" class="section active">
            <table class="news-table">
                <thead><tr><th width="15%">營運商</th><th width="15%">日期</th><th width="70%">情報內容</th></tr></thead>
                <tbody id="data-body">
                    <tr><td colspan="3" style="text-align:center; color:#888;">載入中...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 費率矩陣區塊 -->
        <div id="section-rates" class="section">
            <div class="cpo-tabs">
                <button id="btn-evalue" class="cpo-btn" onclick="renderRate('EVALUE')">EVALUE (時間)</button>
                <button id="btn-icharging" class="cpo-btn" onclick="renderRate('iCharging')">iCharging (時間)</button>
                <button id="btn-tail" class="cpo-btn" onclick="renderRate('TAIL')">TAIL (時間)</button>
                <button id="btn-upower" class="cpo-btn" onclick="renderRate('U-POWER')">U-POWER (單一)</button>
                <button id="btn-yes" class="cpo-btn" onclick="renderRate('YES')">YES!來電 (單一)</button>
            </div>

            <div class="summary-cards" id="rate-summary"></div>
            <div style="overflow-x: auto;">
                <table class="rate-table" id="rate-table-ui">
                    <thead>
                        <tr><th class="time-col">時間</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th><th>週六</th><th>週日</th></tr>
                    </thead>
                    <tbody id="rate-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 頁面切換
        function switchMainTab(tabName) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('section-' + tabName).classList.add('active');
            if(tabName === 'rates' && document.getElementById('rate-tbody').innerHTML === '') {
                renderRate('EVALUE');
            }
        }

        // 解析與掛載標籤顏色
        const getCpoClass = (cpo) => {
            const lower = cpo.toLowerCase();
            if(lower.includes('evalue')) return 'cpo-evalue';
            if(lower.includes('icharging') || lower.includes('cblok')) return 'cpo-icharging';
            if(lower.includes('u-power')) return 'cpo-upower';
            if(lower.includes('tail')) return 'cpo-tail';
            if(lower.includes('yes')) return 'cpo-yes';
            return 'cpo-default';
        };
        
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('data-body');
                tbody.innerHTML = '';
                document.getElementById('update-time').innerText = '最後更新: ' + new Date().toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
                
                if (data.length === 0) return tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">尚無情報</td></tr>';

                data.forEach(item => {
                    let mainTitle = item.title;
                    let tagsHtml = '';
                    const tagMatch = item.title.match(/\[(.*?)\]/);
                    if (tagMatch) {
                        mainTitle = item.title.replace(tagMatch[0], '').trim();
                        tagMatch[1].split('|').forEach(t => {
                            t = t.trim();
                            const isHighlight = t.includes('優惠') || t.includes('新站') ? 'highlight' : '';
                            tagsHtml += `<span class="spec-tag ${isHighlight}">${t}</span>`;
                        });
                    }
                    tbody.innerHTML += `<tr>
                        <td><span class="cpo-tag ${getCpoClass(item.cpo)}">${item.cpo}</span></td>
                        <td style="color:#888; font-size:14px;">${item.date}</td>
                        <td><a href="${item.url}" target="_blank" class="news-link">${mainTitle}</a><br>${tagsHtml}</td>
                    </tr>`;
                });
            }).catch(() => document.getElementById('data-body').innerHTML = '<tr><td colspan="3" style="text-align:center;color:red;">載入失敗，請確認 data.json 是否存在</td></tr>');

        // 💡 5 大 CPO 費率資料庫 (可隨時在此微調最新價格)
        const rateConfigs = {
            'EVALUE': { type: 'TOU', peak: 13.5, offPeak: 6.9, holiday: 8.5, peakStart: 16, peakEnd: 21, color: '#4CAF50' },
            'iCharging': { type: 'TOU', peak: 12.0, offPeak: 6.5, holiday: 6.5, peakStart: 18, peakEnd: 21, color: '#ea580c' },
            'TAIL': { type: 'TOU', peak: 11.9, offPeak: 8.9, holiday: 8.9, peakStart: 16, peakEnd: 22, color: '#0891b2' }, // TAIL 費率結構範例
            'U-POWER': { type: 'FLAT', price: 9.9, color: '#0369a1' },
            'YES': { type: 'FLAT', price: 9.5, color: '#ca8a04' } // YES!來電費率範例
        };

        function renderRate(cpo) {
            // 重置所有按鈕樣式
            document.querySelectorAll('.cpo-btn').forEach(btn => {
                btn.style.backgroundColor = 'white';
                btn.style.color = '#64748b';
                btn.style.borderColor = '#cbd5e1';
            });
            
            // 替作用中的按鈕上專屬品牌色
            const config = rateConfigs[cpo];
            let activeBtn = document.getElementById('btn-' + cpo.toLowerCase().replace('-',''));
            activeBtn.style.backgroundColor = config.color;
            activeBtn.style.color = 'white';
            activeBtn.style.borderColor = config.color;
            
            const summaryDiv = document.getElementById('rate-summary');
            const tbody = document.getElementById('rate-tbody');
            
            document.getElementById('rate-table-ui').style.borderColor = config.color;

            if (config.type === 'TOU') {
                summaryDiv.innerHTML = `
                    <div class="rate-box" style="border-color: #66BB6A; color: #66BB6A;">
                        <div class="rate-box-title">離峰時段</div>
                        <div class="rate-box-price">${config.offPeak}<span class="unit">元/kWh</span></div>
                    </div>
                    <div class="rate-box" style="border-color: #FF7043; color: #FF7043;">
                        <div class="rate-box-title">尖峰時段 ${config.peakStart}:00-${config.peakEnd+1}:00</div>
                        <div class="rate-box-price">${config.peak}<span class="unit">元/kWh</span></div>
                    </div>
                    <div class="rate-box" style="border-color: #AED581; color: #33691E;">
                        <div class="rate-box-title">假日時段</div>
                        <div class="rate-box-price">${config.holiday}<span class="unit">元/kWh</span></div>
                    </div>
                `;
            } else {
                summaryDiv.innerHTML = `
                    <div class="rate-box" style="border-color: ${config.color}; color: ${config.color};">
                        <div class="rate-box-title">全時段單一費率</div>
                        <div class="rate-box-price">${config.price}<span class="unit">元/kWh</span></div>
                    </div>
                `;
            }

            tbody.innerHTML = '';
            for (let h = 0; h < 24; h++) {
                const timeStr = String(h).padStart(2, '0') + ':00~';
                let rowHtml = `<tr><td class="time-col">${timeStr}</td>`;
                
                for (let d = 1; d <= 7; d++) {
                    let price = '', cellClass = '';
                    if (config.type === 'TOU') {
                        if (d >= 6) { price = config.holiday; cellClass = 'cell-holiday'; }
                        else if (h >= config.peakStart && h <= config.peakEnd) { price = config.peak; cellClass = 'cell-peak'; }
                        else { price = config.offPeak; cellClass = 'cell-off-peak'; }
                    } else {
                        price = config.price; 
                        // 單一費率統一用藍色系標註
                        cellClass = 'cell-flat';
                    }
                    rowHtml += `<td class="${cellClass}">$${price}</td>`;
                }
                rowHtml += `</tr>`;
                tbody.innerHTML += rowHtml;
            }
        }
    </script>
</body>
</html>
