<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 台灣充電情報戰情室</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 Chart.js 核心庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #f4f7f6; --text-main: #333; --card-bg: #ffffff; --primary-color: #2563eb; --border-color: #eaeaea; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 1100px; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border-color); }
        .header h1 { margin: 0; font-size: 28px; color: #1e293b; display: flex; align-items: center; gap: 8px;}
        .last-update { font-size: 14px; color: #888; background: #e2e8f0; padding: 6px 14px; border-radius: 20px; font-weight: 500;}
        
        .main-nav { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;}
        .nav-btn { flex: 1; min-width: 150px; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; background: #e2e8f0; color: #475569; transition: 0.3s; }
        .nav-btn.active { background: var(--primary-color); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .section { display: none; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .section.active { display: block; }

        .news-list { display: flex; flex-direction: column; gap: 15px; }
        .news-card { display: flex; align-items: center; gap: 15px; padding: 16px; border: 1px solid var(--border-color); border-radius: 10px; transition: transform 0.2s; background: #fff; }
        .news-card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); border-color: #cbd5e1; }
        .news-cpo { flex-shrink: 0; width: 100px; text-align: center; padding: 8px 0; border-radius: 8px; font-weight: bold; font-size: 13px; }
        .news-content { flex-grow: 1; }
        .news-link { text-decoration: none; color: #1e293b; font-size: 16px; font-weight: 700; display: block; margin-bottom: 6px; }
        .news-link:hover { color: var(--primary-color); }
        .news-date { flex-shrink: 0; color: #94a3b8; font-size: 13px; width: 85px; text-align: right; }
        
        .cpo-fet { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .cpo-evalue { background: #ecfccb; color: #4d7c0f; border: 1px solid #bef264; }
        .cpo-upower { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
        .cpo-icharging { background: #ffedd5; color: #c2410c; border: 1px solid #fdba74; }
        .cpo-tail { background: #cffafe; color: #0891b2; border: 1px solid #67e8f9; }
        .cpo-yes { background: #fef08a; color: #a16207; border: 1px solid #fde047; }
        .cpo-default { background: #f1f5f9; color: #475569; }

        .spec-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .spec-tag { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #f1f5f9; color: #64748b; font-weight: 500;}
        .spec-tag.highlight { background: #fef3c7; color: #b45309; }

        .cpo-tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .cpo-btn { padding: 10px 20px; border: 2px solid #cbd5e1; background: white; border-radius: 25px; cursor: pointer; font-weight: bold; color: #64748b; font-size: 14px; transition: 0.2s;}
        
        .summary-cards { display: flex; gap: 15px; margin-bottom: 20px; text-align: center; }
        .rate-box { flex: 1; padding: 15px; border: 3px solid; border-radius: 10px; background: white; }
        .rate-box-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
        .rate-box-price { font-size: 28px; font-weight: bold; }
        .unit { font-size: 16px; font-weight: normal; }

        .data-table { width: 100%; border-collapse: collapse; text-align: center; border: 2px solid #cbd5e1; border-radius: 8px; overflow: hidden; white-space: nowrap; }
        .data-table th, .data-table td { border: 1px solid #e2e8f0; padding: 10px 8px; font-size: 14px; }
        .data-table th { background: #f8fafc; color: #475569; font-weight: bold; padding: 14px; }
        .time-col { background: #f1f5f9 !important; color: #334155; font-weight: bold; width: 70px; }
        
        .col-fet { background: #fef2f2 !important; font-weight: bold; border-left: 2px solid #ef4444 !important; border-right: 2px solid #ef4444 !important; }
        .cell-win { color: #16a34a; font-weight: 900; }
        .cell-tie { color: #2563eb; font-weight: 900; }
        .cell-lose { color: #dc2626; font-weight: 900; }

        .cell-off-peak { background: #86efac; color: #14532d; font-weight: 500; }
        .cell-peak { background: #fdba74; color: #7c2d12; font-weight: 500; }
        .cell-holiday { background: #d9f99d; color: #3f6212; font-weight: 500; }
        .cell-flat { background: #bae6fd; color: #0c4a6e; font-weight: 500; }

        .toggle-group { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
        .toggle-btn { padding: 10px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; border: 2px solid #cbd5e1; background: white; color: #64748b; }
        .toggle-btn.active { background: #334155; color: white; border-color: #334155; }

        @media (max-width: 768px) {
            .news-card { flex-direction: column; align-items: flex-start; gap: 10px;}
            .news-date { text-align: left; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>⚡ 台灣充電情報戰情室</h1>
            <div class="last-update" id="update-time">讀取資料中...</div>
        </div>
        
        <div class="main-nav">
            <button class="nav-btn active" onclick="switchMainTab('news')">📡 動態情報牆</button>
            <button class="nav-btn" onclick="switchMainTab('compare')">🔥 競品定價分析</button>
            <button class="nav-btn" onclick="switchMainTab('trend')">📈 量化趨勢分析</button>
            <button class="nav-btn" onclick="switchMainTab('rates')">💰 各家詳細費率</button>
        </div>

        <div id="section-news" class="section active">
            <div class="news-list" id="news-container">
                <div style="text-align:center; color:#888; padding: 20px;">載入情報中...</div>
            </div>
        </div>

        <div id="section-compare" class="section">
            <div class="toggle-group">
                <button id="toggle-weekday" class="toggle-btn active" onclick="renderCompare(false)">工作日 (週一~五)</button>
                <button id="toggle-weekend" class="toggle-btn" onclick="renderCompare(true)">週末假日 (六~日)</button>
            </div>
            <div style="text-align: center; margin-bottom: 15px; color: #64748b; font-size: 14px;">
                以 <strong>遠傳 (FET)</strong> 為基準，自動計算該時段對比競品最低價之優勢與劣勢。
            </div>
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="time-col">時間</th>
                            <th class="col-fet" style="color:#b91c1c;">遠傳 (基準)</th>
                            <th>EVALUE</th>
                            <th>iCharging</th>
                            <th>TAIL</th>
                            <th>U-POWER</th>
                            <th>YES!來電</th>
                            <th style="background:#f8fafc; color:#0f172a; width: 140px;">💡 優劣勢分析</th>
                        </tr>
                    </thead>
                    <tbody id="compare-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- 全新：量化趨勢分析區塊 -->
        <div id="section-trend" class="section">
            <div style="text-align: center; margin-bottom: 20px; color: #64748b; font-size: 15px;">
                追蹤各家 CPO 近半年快充站建置累計數量，掌握市場擴張動能與資本投入斜率。
            </div>
            <!-- 💡 加上 position: relative 與固定高度，確保圖表不會縮小成 0 像素 -->
            <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid #cbd5e1; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); position: relative; height: 400px; width: 100%;">
                <canvas id="expansionChart"></canvas>
            </div>
        </div>

        <div id="section-rates" class="section">
            <div class="cpo-tabs">
                <button id="btn-fet" class="cpo-btn" onclick="renderRate('FET')">遠傳 (時間)</button>
                <button id="btn-evalue" class="cpo-btn" onclick="renderRate('EVALUE')">EVALUE (時間)</button>
                <button id="btn-icharging" class="cpo-btn" onclick="renderRate('iCharging')">iCharging (時間)</button>
                <button id="btn-tail" class="cpo-btn" onclick="renderRate('TAIL')">TAIL (時間)</button>
                <button id="btn-upower" class="cpo-btn" onclick="renderRate('U-POWER')">U-POWER (單一)</button>
                <button id="btn-yes" class="cpo-btn" onclick="renderRate('YES')">YES!來電 (單一)</button>
            </div>
            <div class="summary-cards" id="rate-summary"></div>
            <div style="overflow-x: auto;">
                <table class="data-table" id="rate-table-ui">
                    <thead>
                        <tr><th class="time-col">時間</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th><th>週六</th><th>週日</th></tr>
                    </thead>
                    <tbody id="rate-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const rateConfigs = {
            'FET': { type: 'TOU', peak: 10.9, offPeak: 6.8, holiday: 7.9, peakStart: 16, peakEnd: 21, color: '#ef4444' },
            'EVALUE': { type: 'TOU', peak: 13.5, offPeak: 6.9, holiday: 8.5, peakStart: 16, peakEnd: 21, color: '#4CAF50' },
            'iCharging': { type: 'TOU', peak: 12.0, offPeak: 6.5, holiday: 6.5, peakStart: 18, peakEnd: 21, color: '#ea580c' },
            'TAIL': { type: 'TOU', peak: 11.9, offPeak: 8.9, holiday: 8.9, peakStart: 16, peakEnd: 21, color: '#0891b2' },
            'U-POWER': { type: 'FLAT', price: 9.9, color: '#0369a1' },
            'YES': { type: 'FLAT', price: 9.5, color: '#ca8a04' }
        };

        const cposForCompare = ['FET', 'EVALUE', 'iCharging', 'TAIL', 'U-POWER', 'YES'];
        let trendChartInstance = null; // 全域圖表變數

        // 統一的分頁切換邏輯
        function switchMainTab(tabName) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('section-' + tabName).classList.add('active');
            
            if(tabName === 'rates' && document.getElementById('rate-tbody').innerHTML === '') renderRate('FET');
            if(tabName === 'compare' && document.getElementById('compare-tbody').innerHTML === '') renderCompare(false);
            if(tabName === 'trend') renderTrendChart(); // 切換時繪製趨勢圖
        }

        const getCpoClass = (cpo) => {
            const lower = cpo.toLowerCase();
            if(lower.includes('遠傳') || lower.includes('fet')) return 'cpo-fet';
            if(lower.includes('evalue')) return 'cpo-evalue';
            if(lower.includes('icharging') || lower.includes('cblok')) return 'cpo-icharging';
            if(lower.includes('u-power')) return 'cpo-upower';
            if(lower.includes('tail')) return 'cpo-tail';
            if(lower.includes('yes')) return 'cpo-yes';
            return 'cpo-default';
        };
        
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('news-container');
                container.innerHTML = '';
                document.getElementById('update-time').innerText = '最後更新: ' + new Date().toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
                
                if (data.length === 0) return container.innerHTML = '<div style="text-align:center;">尚無情報</div>';

                data.forEach(item => {
                    let mainTitle = item.title;
                    let tagsHtml = '';
                    const tagMatch = item.title.match(/\[(.*?)\]/);
                    if (tagMatch) {
                        mainTitle = item.title.replace(tagMatch[0], '').trim();
                        tagMatch[1].split('|').forEach(t => {
                            t = t.trim();
                            const isHighlight = t.includes('優惠') || t.includes('新站') ? 'highlight' : '';
                            tagsHtml += `<span class="spec-tag ${isHighlight}">${t}</span>`;
                        });
                    }
                    container.innerHTML += `
                        <div class="news-card">
                            <div class="news-cpo ${getCpoClass(item.cpo)}">${item.cpo}</div>
                            <div class="news-content">
                                <a href="${item.url}" target="_blank" class="news-link">${mainTitle}</a>
                                <div class="spec-tags">${tagsHtml}</div>
                            </div>
                            <div class="news-date">${item.date}</div>
                        </div>
                    `;
                });
            }).catch(() => document.getElementById('news-container').innerHTML = '<div style="text-align:center;color:red;">載入失敗</div>');

        function getPriceAtHour(cpo, hour, isWeekend) {
            const config = rateConfigs[cpo];
            if (config.type === 'FLAT') return config.price;
            if (isWeekend) return config.holiday;
            if (hour >= config.peakStart && hour <= config.peakEnd) return config.peak;
            return config.offPeak;
        }

        function renderCompare(isWeekend) {
            document.getElementById('toggle-weekday').className = 'toggle-btn' + (!isWeekend ? ' active' : '');
            document.getElementById('toggle-weekend').className = 'toggle-btn' + (isWeekend ? ' active' : '');
            
            const tbody = document.getElementById('compare-tbody');
            tbody.innerHTML = '';

            for (let h = 0; h < 24; h++) {
                const timeStr = String(h).padStart(2, '0') + ':00';
                let rowHtml = `<tr><td class="time-col">${timeStr}</td>`;
                
                let prices = cposForCompare.map(cpo => getPriceAtHour(cpo, h, isWeekend));
                let fetPrice = prices[0];
                let otherPrices = prices.slice(1);
                let minOtherPrice = Math.min(...otherPrices);
                
                cposForCompare.forEach((cpo, index) => {
                    let price = prices[index];
                    let isFet = index === 0;
                    let cellClass = isFet ? 'col-fet' : '';
                    rowHtml += `<td class="${cellClass}">$${price.toFixed(1)}</td>`;
                });
                
                let analysisHtml = '';
                let diff = (fetPrice - minOtherPrice).toFixed(1);
                
                if (fetPrice < minOtherPrice) {
                    analysisHtml = `<span class="cell-win">🏆 完勝 (省 $${Math.abs(diff)})</span>`;
                } else if (fetPrice === minOtherPrice) {
                    analysisHtml = `<span class="cell-tie">🤝 平手最佳</span>`;
                } else {
                    analysisHtml = `<span class="cell-lose">⚠️ 偏貴 (多 $${diff})</span>`;
                }
                
                rowHtml += `<td>${analysisHtml}</td></tr>`;
                tbody.innerHTML += rowHtml;
            }
        }

        // 📈 量化趨勢圖渲染邏輯
        function renderTrendChart() {
            const ctx = document.getElementById('expansionChart').getContext('2d');
            
            if (trendChartInstance) {
                trendChartInstance.destroy();
            }

            const months = ['2026-03', '2026-04', '2026-05', '2026-06', '2026-07', '2026-08'];
            
            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [
                        {
                            label: '遠傳 (FET)',
                            data: [12, 18, 25, 38, 52, 65],
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            borderWidth: 3,
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: 'U-POWER',
                            data: [45, 48, 52, 55, 60, 68],
                            borderColor: '#0369a1',
                            borderWidth: 2,
                            tension: 0.3
                        },
                        {
                            label: 'EVALUE',
                            data: [80, 82, 85, 87, 89, 92],
                            borderColor: '#4CAF50',
                            borderWidth: 2,
                            tension: 0.3
                        },
                        {
                            label: 'TAIL',
                            data: [35, 40, 48, 55, 58, 62],
                            borderColor: '#0891b2',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top', labels: { font: { family: 'Noto Sans TC', size: 13 } } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: '累計 DC 快充站數', font: { size: 14, weight: 'bold' } } },
                        x: { grid: { display: false } }
                    },
                    interaction: { mode: 'nearest', axis: 'x', intersect: false }
                }
            });
        }

        function renderRate(cpo) {
            document.querySelectorAll('.cpo-btn').forEach(btn => {
                btn.style.backgroundColor = 'white'; btn.style.color = '#64748b'; btn.style.borderColor = '#cbd5e1';
            });
            const config = rateConfigs[cpo];
            let activeBtn = document.getElementById('btn-' + cpo.toLowerCase().replace('-',''));
            activeBtn.style.backgroundColor = config.color; activeBtn.style.color = 'white'; activeBtn.style.borderColor = config.color;
            
            const summaryDiv = document.getElementById('rate-summary');
            const tbody = document.getElementById('rate-tbody');
            document.getElementById('rate-table-ui').style.borderColor = config.color;

            if (config.type === 'TOU') {
                summaryDiv.innerHTML = `
                    <div class="rate-box" style="border-color: #86efac; color: #14532d;">
                        <div class="rate-box-title">離峰時段</div><div class="rate-box-price">${config.offPeak}<span class="unit">元/kWh</span></div>
                    </div>
                    <div class="rate-box" style="border-color: #fdba74; color: #7c2d12;">
                        <div class="rate-box-title">尖峰時段 ${config.peakStart}:00-${config.peakEnd+1}:00</div><div class="rate-box-price">${config.peak}<span class="unit">元/kWh</span></div>
                    </div>
                    <div class="rate-box" style="border-color: #d9f99d; color: #3f6212;">
                        <div class="rate-box-title">假日時段</div><div class="rate-box-price">${config.holiday}<span class="unit">元/kWh</span></div>
                    </div>
                `;
            } else {
                summaryDiv.innerHTML = `
                    <div class="rate-box" style="border-color: ${config.color}; color: ${config.color};">
                        <div class="rate-box-title">全時段單一費率</div><div class="rate-box-price">${config.price}<span class="unit">元/kWh</span></div>
                    </div>
                `;
            }

            tbody.innerHTML = '';
            for (let h = 0; h < 24; h++) {
                const timeStr = String(h).padStart(2, '0') + ':00~';
                let rowHtml = `<tr><td class="time-col">${timeStr}</td>`;
                for (let d = 1; d <= 7; d++) {
                    let price = '', cellClass = '';
                    if (config.type === 'TOU') {
                        if (d >= 6) { price = config.holiday; cellClass = 'cell-holiday'; }
                        else if (h >= config.peakStart && h <= config.peakEnd) { price = config.peak; cellClass = 'cell-peak'; }
                        else { price = config.offPeak; cellClass = 'cell-off-peak'; }
                    } else { price = config.price; cellClass = 'cell-flat'; }
                    rowHtml += `<td class="${cellClass}">$${price.toFixed(1)}</td>`;
                }
                rowHtml += `</tr>`;
                tbody.innerHTML += rowHtml;
            }
        }
    </script>
</body>
</html>
